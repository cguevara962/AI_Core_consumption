apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: material-consumption-training
  annotations:
    scenarios.ai.sap.com/description: "Training pipeline for material consumption prediction"
    scenarios.ai.sap.com/name: "material-consumption"
    scenarios.ai.sap.com/id: "material-consumption"
    executables.ai.sap.com/description: "Trains a Random Forest model to predict material consumption"
    executables.ai.sap.com/name: "consumption-training"
    artifacts.output.ai.sap.com/artifactNames: "trained_model"
  labels:
    ai.sap.com/version: "0.0.1"
    scenarios.ai.sap.com/id: "material-consumption"
spec:
  imagePullSecrets:
    - name: docker-registry-secret
  entrypoint: training-pipeline
  arguments:
    parameters:
      - name: n_estimators
        value: "200"
      - name: max_depth
        value: "8"
      - name: test_size
        value: "0.2"
      - name: aws_access_key_id
        value: ""
      - name: aws_secret_access_key
        value: ""
  templates:
    - name: training-pipeline
      metadata:
        annotations:
          ai.sap.com/resourcePlan: "starter"
      inputs:
        parameters:
          - name: n_estimators
          - name: max_depth
          - name: test_size
          - name: aws_access_key_id
          - name: aws_secret_access_key
      outputs:
        artifacts:
          - name: trained_model
            path: /tmp/model
            globalName: trained_model
            archive:
              none: {}
      container:
        image: "docker.io/cguevara962/consumption-train:latest"
        imagePullPolicy: Always
        command: ["python", "/app/train.py"]
        env:
          - name: N_ESTIMATORS
            value: "{{inputs.parameters.n_estimators}}"
          - name: MAX_DEPTH
            value: "{{inputs.parameters.max_depth}}"
          - name: TEST_SIZE
            value: "{{inputs.parameters.test_size}}"
          - name: S3_BUCKET
            value: "hcp-c096a718-bfa7-4194-858b-01b0ed9a3609"
          - name: S3_KEY
            value: "consumption-ai/data/consumption.csv"
          - name: S3_ENDPOINT
            value: "https://s3.amazonaws.com"
          - name: S3_REGION
            value: "us-east-1"
          - name: AWS_ACCESS_KEY_ID
            value: "{{inputs.parameters.aws_access_key_id}}"
          - name: AWS_SECRET_ACCESS_KEY
            value: "{{inputs.parameters.aws_secret_access_key}}"
